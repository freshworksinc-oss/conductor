# Two-instance backing services for the migrator end-to-end test.
#   podman-compose -f local-demo/two-instance/docker-compose.yaml up -d
#
# SOURCE:  Postgres :55432, Redis :6379   (Conductor server runs on :8080)
# DEST:    Postgres :55433, Redis :6380   (Conductor server runs on :8081)
services:
  postgres-source:
    image: docker.io/library/postgres:15-alpine
    container_name: cnd-postgres-source
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-source:
    image: docker.io/library/redis:7-alpine
    container_name: cnd-redis-source
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  postgres-dest:
    image: docker.io/library/postgres:15-alpine
    container_name: cnd-postgres-dest
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis-dest:
    image: docker.io/library/redis:7-alpine
    container_name: cnd-redis-dest
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
