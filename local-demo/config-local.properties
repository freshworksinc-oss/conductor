# Conductor local config: Postgres (persistence + indexing + payload) + Redis (queues + lock).
# Backing services: local-demo/docker-compose.yaml. No Elasticsearch.
#   java -DCONDUCTOR_CONFIG_FILE=$(pwd)/local-demo/config-local.properties -jar server/build/libs/conductor-server-boot.jar

# ---- Persistence (Postgres) ----  (also provides the DataSource the tenant config needs)
conductor.db.type=postgres
conductor.external-payload-storage.type=postgres
spring.datasource.url=jdbc:postgresql://127.0.0.1:55432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor

# ---- Queues + lock (Redis) ----
conductor.queue.type=redis_standalone
conductor.redis.hosts=127.0.0.1:6379:us-east-1c
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.ssl=false
conductor.workflow-execution-lock.type=redis
conductor.redis-lock.serverAddress=redis://127.0.0.1:6379
conductor.app.workflowExecutionLockEnabled=true

# ---- Indexing (Postgres, no Elasticsearch) ----
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0

# ---- Metrics exposed to Prometheus at /actuator/prometheus ----
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus

loadSample=false
