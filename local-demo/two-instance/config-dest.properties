# DEST Conductor: Postgres :55433 + Redis :6380, HTTP on :8081.
#   java -DCONDUCTOR_CONFIG_FILE=$(pwd)/local-demo/two-instance/config-dest.properties \
#        -jar server/build/libs/conductor-server-boot.jar
server.port=8081

# ---- Persistence (Postgres) ----
conductor.db.type=postgres
conductor.external-payload-storage.type=postgres
spring.datasource.url=jdbc:postgresql://127.0.0.1:55433/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor

# ---- Queues + lock (Redis) ----
conductor.queue.type=redis_standalone
conductor.redis.hosts=127.0.0.1:6380:us-east-1c
conductor.redis.workflowNamespacePrefix=conductor
conductor.redis.queueNamespacePrefix=conductor_queues
conductor.redis.ssl=false
conductor.workflow-execution-lock.type=redis
conductor.redis-lock.serverAddress=redis://127.0.0.1:6380
conductor.app.workflowExecutionLockEnabled=true

# ---- Indexing (Postgres, no Elasticsearch) ----
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0

# ---- Repair service so verifyAndRepair works (F5) ----
conductor.workflow-repair-service.enabled=true

loadSample=false
