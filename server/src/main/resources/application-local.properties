# Local dev profile — sandbox-like layout with local Postgres + Redis.
# Infra: podman compose -f docker/docker-compose-postgres-redis-observability.yaml up -d conductor-postgres conductor-redis
# Run:   SPRING_PROFILES_ACTIVE=local ./gradlew :conductor-server:bootRun --no-daemon

spring.application.name=conductor

# ---------- Persistence (Postgres) ----------
conductor.db.type=postgres
spring.datasource.url=jdbc:postgresql://localhost:6432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Sandbox uses S3; use postgres payload storage locally (no AWS required).
conductor.external-payload-storage.type=postgres

# ---------- Queues (Redis via orkes-conductor-queues) ----------
conductor.queue.type=redis_standalone
conductor.redis.hosts=localhost:6379:us-east-1c
conductor.redis.workflowNamespacePrefix=default.wf
conductor.redis.queueNamespacePrefix=default.q
conductor.redis.availabilityZone=us-east-1c
conductor.redis.dataCenterRegion=us-east-1
conductor.app.stack=local

# ---------- Indexing ----------
# Sandbox uses OpenSearch; use postgres indexing locally (no ES/OpenSearch container needed).
conductor.indexing.enabled=true
conductor.indexing.type=postgres
conductor.elasticsearch.version=0
conductor.app.taskIndexingEnabled=false
conductor.app.summary-input-output-json-serialization.enabled=true

# ---------- Event queues / processor (EVENT task + event handlers) ----------
conductor.event-queues.default.enabled=true
conductor.default-event-processor.enabled=true

# ---------- Redis workflow execution locks ----------
conductor.app.workflowExecutionLockEnabled=true
conductor.workflow-execution-lock.type=redis
conductor.redis-lock.serverType=single
conductor.redis-lock.serverAddress=redis://127.0.0.1:6379
conductor.redis-lock.namespace=conductor_locks_local
conductor.app.lockLeaseTime=10s
conductor.app.lockTimeToTry=5s

# ---------- Sweeper / system-task workers (core + async in one JVM) ----------
conductor.sweep-frequency.millis=5000
conductor.app.systemTaskWorkerCallbackDuration=10s
conductor.app.sweepFrequency=10s
conductor.app.sweeperWorkflowPollTimeout=2s
conductor.app.systemTaskWorkerThreadCount=8
conductor.app.systemTaskWorkerPollInterval=10ms
conductor.app.eventQueuePollInterval=10ms
conductor.system-task-workers.enabled=true
conductor.workflow-reconciler.enabled=true
conductor.workflow-repair-service.enabled=true

# ---------- Payload thresholds ----------
conductor.app.workflowInputPayloadSizeThreshold=10000
conductor.app.workflowOutputPayloadSizeThreshold=10000
conductor.app.taskInputPayloadSizeThreshold=10000
conductor.app.taskOutputPayloadSizeThreshold=10000

# ---------- HTTP task timeouts ----------
conductor.tasks.http.readTimeout=10000ms
conductor.tasks.http.connectTimeout=10000ms

# ---------- Metrics ----------
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
server.tomcat.mbeanregistry.enabled=true

# ---------- Server ----------
server.port=8080
loadSample=false
logging.file.name=server/logs/conductor-server.log
logging.level.com.netflix.conductor.core.execution.WorkflowExecutorOps=DEBUG
logging.level.com.netflix.conductor.contribs.listener=DEBUG

# ---------- Central notifications (optional — set CENTRAL_COLLECTOR_AUTH_TOKEN to enable) ----------
conductor.workflow-status-listener.type=composite
conductor.workflow-status-listener.composite.types=queue_publisher,workflow_publisher
conductor.task-status-listener.type=task_publisher
conductor.status-notifier.notification.url=http://staging.central.us-east-1.edge
conductor.status-notifier.notification.endpoint-workflow=collector
conductor.status-notifier.notification.endpoint-task=collector
conductor.status-notifier.notification.header-prefer=service
conductor.status-notifier.notification.header-prefer-value=${CENTRAL_COLLECTOR_AUTH_TOKEN:}
conductor.status-notifier.notification.subscribed-task-statuses=SCHEDULED,IN_PROGRESS,COMPLETED,FAILED,TIMED_OUT,CANCELED
conductor.status-notifier.notification.subscribed-workflow-statuses=RUNNING,COMPLETED,FAILED,TIMED_OUT,TERMINATED,PAUSED
