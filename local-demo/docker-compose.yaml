# Backing services for running Conductor locally (server runs from source).
#   podman-compose -f local-demo/docker-compose.yaml up -d
services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: cnd-postgres
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    ports:
      # host 55432 -> container 5432 (avoids clashing with a local brew Postgres on 5432)
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d conductor"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: cnd-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
