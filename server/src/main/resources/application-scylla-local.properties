# Local dev profile — Scylla persistence + Redis queues/locks.
# Infra: podman start conductor-redis conductor-postgres
#        podman run -d --name conductor-scylla -p 9042:9042 docker.io/scylladb/scylla:latest --smp 1 --memory 1G --overprovisioned 1 --developer-mode 1
# Run:   SPRING_PROFILES_ACTIVE=scylla-local ./gradlew :conductor-server:bootRun --no-daemon
# View:  cqlsh localhost 9042 -k conductor

spring.application.name=conductor

# ---------- Persistence (Scylla) ----------
# Keyspace + tables are created on startup by ScyllaBaseDAO.
conductor.db.type=scylla
conductor.scylla.host-address=127.0.0.1
conductor.scylla.port=9042
conductor.scylla.keyspace=conductor
# Single local node: RF=1 and ONE-level consistency (defaults are RF=3 / LOCAL_QUORUM).
# Recent Scylla enables tablets by default, which rejects SimpleStrategy — use NTS on the node's DC.
conductor.scylla.replication-strategy=NetworkTopologyStrategy
conductor.scylla.replication-factor-key=datacenter1
conductor.scylla.replication-factor-value=1
conductor.scylla.read-consistency-level=LOCAL_ONE
conductor.scylla.write-consistency-level=LOCAL_ONE

# ---------- Postgres (TenantMetadataDAO only) ----------
# TenantMetadataConfiguration unconditionally needs a DataSource and reads meta_workflow_def /
# meta_task_def directly from Postgres — tenant-scoped metadata reads do NOT come from Scylla.
spring.datasource.url=jdbc:postgresql://localhost:6432/conductor
spring.datasource.username=conductor
spring.datasource.password=conductor
# Schema is owned by the postgres profile; don't let Boot's Flyway validate/migrate it here.
spring.flyway.enabled=false

# ---------- Queues (Redis via orkes-conductor-queues) ----------
conductor.queue.type=redis_standalone
conductor.redis.hosts=localhost:6379:us-east-1c
conductor.redis.workflowNamespacePrefix=scylla.wf
conductor.redis.queueNamespacePrefix=scylla.q
conductor.redis.availabilityZone=us-east-1c
conductor.redis.dataCenterRegion=us-east-1
conductor.app.stack=local

# ---------- Indexing ----------
# Postgres indexing is only wired with conductor.db.type=postgres; no ES/OpenSearch locally.
# Workflow search (UI list) will be empty — fetch workflows by id instead.
conductor.indexing.enabled=false
conductor.elasticsearch.version=0

# ---------- Event queues / processor (EVENT task + event handlers) ----------
conductor.event-queues.default.enabled=true
conductor.default-event-processor.enabled=true

# ---------- Redis locks (workflow execution + ScyllaExecutionDAO task lock) ----------
conductor.app.workflowExecutionLockEnabled=true
conductor.workflow-execution-lock.type=redis
conductor.redis-lock.serverType=single
conductor.redis-lock.serverAddress=redis://127.0.0.1:6379
conductor.redis-lock.namespace=conductor_locks_scylla_local
conductor.app.lockLeaseTime=10s
conductor.app.lockTimeToTry=5s

# ---------- Sweeper / system-task workers ----------
conductor.app.sweepFrequency=10s
conductor.app.sweeperWorkflowPollTimeout=2s
conductor.app.systemTaskWorkerThreadCount=8
conductor.app.systemTaskWorkerPollInterval=10ms
conductor.app.eventQueuePollInterval=10ms
conductor.system-task-workers.enabled=true
conductor.workflow-reconciler.enabled=true
conductor.workflow-repair-service.enabled=true

# ---------- Metrics ----------
conductor.metrics-prometheus.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# ---------- Server ----------
server.port=8080
loadSample=false
logging.file.name=server/logs/conductor-server-scylla.log
