# Temporary app-level migrator service configuration.
# Run (config-driven, e.g. k8s):  java -jar conductor-migrator.jar        (uses migrator.mode)
#  or (CLI):                       java -jar conductor-migrator.jar --sync

spring:
  main:
    banner-mode: "off"
  # The destination schema is owned by the destination Conductor. Spring Boot's Flyway
  # auto-configuration stays OFF (flyway-core is transitively present). Schema creation, when
  # needed, is done explicitly by SchemaInitializer (migrator.dest-datasource.init-schema=true),
  # not by this auto-config.
  flyway:
    enabled: false

# A reactive server runs only to serve the /health probe (WebClient is otherwise client-only).
server:
  port: 8080
management:
  # We only want /health. Disable all micrometer meter-registry exporters — conductor-core drags in
  # registries (e.g. datadog) that otherwise fail context startup demanding an API key.
  defaults:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true   # exposes /actuator/health/liveness and /readiness

migrator:
  # Operations to run when no CLI flag is passed (k8s auto-start). Values: metadata, sync.
  mode: []          # e.g. [metadata, sync] — set in the container/k8s config.properties
  source:
    # Point at the edge/auth-proxy to have tenant scoping + OpenSearch query formatting handled
    # for you (send tenant-id below); or a conductor-core service for direct/unscoped access.
    url: http://localhost:8080
    auth-header: ""
    # Sent as the x-tenant-id header on every source request. Required via the edge/auth-proxy —
    # it uses this to tenant-scope search, metadata listing and workflow access.
    tenant-id: ""
  dest:
    url: http://localhost:8081
    auth-header: ""
  dest-datasource:
    url: jdbc:postgresql://127.0.0.1:55433/conductor
    username: conductor
    password: conductor
    schema: public
    # When true, run Flyway (postgres-persistence migrations) against the dest DB before migrating,
    # so the dest Conductor need not have run first. Off by default.
    init-schema: false
  batch-size: 10
  payload-enabled: false
  poll-data:
    # One-shot copy of source poll_data (last-poll-time per taskDefName/domain) into the dest.
    # Transient/self-healing (workers repopulate on the dest); lastPollTime is stamped at migration
    # time by the DAO. Off by default.
    enabled: false
  metadata:
    # How definitions (task/workflow defs, event handlers) are written to the destination:
    #   rest → via the dest Conductor's REST API (default; cache-consistent on a live server)
    #   jdbc → directly into the meta_* tables via the embedded DAO (uniform with execution
    #          writes; a running dest server sees new task defs only after its ≤60s cache refresh,
    #          so prefer this for an up-front bulk load before the dest serves traffic)
    writer: rest
  sync:
    # --sync mode: seconds between delta-sync passes. Each pass re-enumerates the source's
    # non-terminal workflows and re-imports changed trees, keeping the dest copies DORMANT
    # (no bootstrap — the source stays authoritative until the flip).
    interval-seconds: 15
  history:
    # --history / mode=history: one-shot back-fill of TERMINAL executions. Enumerates these
    # statuses (paginated), imports each tree dormant (no bootstrap), skips archived ids that 404.
    # Writes Postgres index tables only — OpenSearch-backed dests still need an OS→OS reindex.
    statuses:
      - COMPLETED
      - FAILED
      - TERMINATED
      - TIMED_OUT
    # auto-chunk: walk search.start-time-from-ms..-to-ms (default 0..now) in window-days slices,
    # halving any slice that would exceed OpenSearch's 10k window — migrates a large history in one
    # run. Best run as its own job (mode=history) for big back-fills.
    auto-chunk: false
    window-days: 7
  search:
    # Scoping applied to the source /api/workflow/search enumeration (sync + history).
    free-text: "*"            # some backends (OpenSearch proxy) return nothing without this
    sort: "startTime:DESC"
    # Set false when 'status IN (...)' doesn't translate on the backend (e.g. sip's OpenSearch
    # proxy) — then enumerate purely by the startTime window below.
    status-filter: true
    # Datetime window (epoch millis). from-ms>0 → startTime>from; to-ms>0 → startTime<to.
    # Use the window to bound history and to chunk under OpenSearch's 10k max_result_window.
    start-time-from-ms: 0
    start-time-to-ms: 0

# The embedded PostgresIndexDAO binds a few of these; the destination schema is owned by the
# destination Conductor, so the migrator must never run Flyway.
conductor:
  postgres:
    apply-data-migrations: false
    only-index-on-status-change: false
    schema: public

logging:
  level:
    com.netflix.conductor.migrator: INFO
