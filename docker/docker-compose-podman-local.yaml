# Local Podman dev stack
#
# Profiles:
#   postgres (default) — Conductor uses Postgres for DB + queues + index.
#                      Also starts Redis container (idle) for manual/cli use.
#   redis            — Conductor uses Redis + Elasticsearch (sandbox-like).
#
# Examples:
#   cd docker
#   podman-compose -f docker-compose-podman-local.yaml --profile postgres up --build
#   podman-compose -f docker-compose-podman-local.yaml --profile redis up --build
#
# UI:  http://localhost:8127
# API: http://localhost:8080

services:
  # ---------- Postgres-backed Conductor (recommended for event-handler testing) ----------
  conductor-server-postgres:
    environment:
      - CONFIG_PROP=config-postgres-local.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false
    image: conductor:server
    container_name: conductor-server-local
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS:-}
    networks:
      - conductor-local
    ports:
      - "8080:8080"
      - "8127:5000"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s
    depends_on:
      conductor-postgres:
        condition: service_healthy
    links:
      - conductor-postgres:postgresdb
    profiles:
      - postgres

  conductor-postgres:
    image: postgres:15-alpine
    container_name: conductor-postgres-local
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
    volumes:
      - pgdata-conductor-local:/var/lib/postgresql/data
    networks:
      - conductor-local
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
      - postgres
      - infra

  conductor-redis:
    image: redis:6.2.3-alpine
    container_name: conductor-redis-local
    networks:
      - conductor-local
    ports:
      - "7379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    profiles:
      - postgres
      - redis
      - infra

  # ---------- Redis-backed Conductor (optional; needs Elasticsearch) ----------
  conductor-server-redis:
    environment:
      - CONFIG_PROP=config-redis.properties
      - JAVA_OPTS=-Dpolyglot.engine.WarnInterpreterOnly=false
    image: conductor:server
    container_name: conductor-server-local
    build:
      context: ../
      dockerfile: docker/server/Dockerfile
      args:
        YARN_OPTS: ${YARN_OPTS:-}
    networks:
      - conductor-local
    ports:
      - "8080:8080"
      - "8127:5000"
    healthcheck:
      test: ["CMD", "curl", "-I", "-XGET", "http://localhost:8080/health"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 180s
    depends_on:
      conductor-redis:
        condition: service_healthy
      conductor-elasticsearch:
        condition: service_healthy
    links:
      - conductor-redis:rs
      - conductor-elasticsearch:es
    profiles:
      - redis

  conductor-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.11
    container_name: conductor-es-local
    environment:
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
      discovery.type: single-node
    volumes:
      - esdata-conductor-local:/usr/share/elasticsearch/data
    networks:
      - conductor-local
    ports:
      - "9201:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    profiles:
      - redis

volumes:
  pgdata-conductor-local:
  esdata-conductor-local:

networks:
  conductor-local:
